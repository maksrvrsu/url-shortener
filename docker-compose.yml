services:
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-url_shortener}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  url-shortener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url-shortener-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      ENV: ${ENV:-local}
      CONFIG_PATH: "config/local.yaml"
      HTTP_SERVER_ADDRESS: 0.0.0.0:8082
      HTTP_SERVER_TIMEOUT: ${HTTP_SERVER_TIMEOUT:-4s}
      HTTP_SERVER_IDLE_TIMEOUT: ${HTTP_SERVER_IDLE_TIMEOUT:-60s}
      HTTP_SERVER_USER: ${HTTP_SERVER_USER}
      HTTP_SERVER_PASSWORD: ${HTTP_SERVER_PASSWORD}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-url_shortener}?sslmode=disable
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
      POSTGRES_SSLMODE: disable
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
